[project]
name = "outpost"
version = "0.1.0"
description = "TimeTree photo reminder — push notifications during calendar events via ntfy.sh"
requires-python = ">=3.12"
dependencies = ["requests>=2.28.0", "python-dotenv>=1.0.0"]

[project.scripts]
photo-reminder = "main:main"
discover = "discover:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timetree"]
